<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edinburgh Bus Station Departures</title>
<style>body{margin:0;background:#071018;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}.loading{padding:24px;text-align:center}.loading b{display:block;font-size:22px;margin-bottom:8px}.loading span{color:#9fb0bf}.fallback{display:none;margin-top:18px;color:#ffc94d}</style>
</head>
<body>
<div class="loading"><b>Edinburgh Bus Station</b><span>Loading today’s departure board…</span><a class="fallback" id="fallback" href="https://github.com/michaelskinner75-cyber/edinburgh-departure-board/blob/main/index.html">Open board source</a></div>
<script>
fetch('https://raw.githubusercontent.com/michaelskinner75-cyber/edinburgh-departure-board/main/index.html',{cache:'no-store'})
.then(function(r){if(!r.ok)throw new Error('load failed');return r.text();})
.then(function(html){document.open();document.write(html);document.close();})
.catch(function(){document.querySelector('.loading span').textContent='Could not load the departure board.';document.getElementById('fallback').style.display='inline-block';});
</script>
</body>
</html>
