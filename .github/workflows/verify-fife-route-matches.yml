name: Import additional verified official Fife timetables
on:
  push:
    paths:
      - '.github/workflows/verify-fife-route-matches.yml'
      - 'scripts/resolve_official_fife_routes.py'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Import verified normal-day Fife routes without touching existing notes
        run: python3 scripts/resolve_official_fife_routes.py --mode apply
