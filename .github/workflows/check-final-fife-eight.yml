name: Import final eight verified Fife routes
on:
  push:
    paths:
      - '.github/workflows/check-final-fife-eight.yml'
      - 'scripts/import_last_eight_fife.py'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Import eight manually audited official route registrations
        run: python3 scripts/import_last_eight_fife.py --mode apply
