name: Build West Scotland bus stop CSV
on:
  push:
    paths:
      - '.github/workflows/build-west-stops.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install coordinate conversion
        run: python3 -m pip install --quiet pyproj
      - name: Fetch official NaPTAN West Scotland bus stops
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, zipfile, csv, io, pathlib, datetime
          from pyproj import Transformer
          codes=['617','618','619','609','614','615','616','680','607','608','611','612','613']
          url='https://naptan.api.dft.gov.uk/v1/access-nodes?'+urllib.parse.urlencode({'atcoAreaCodes':','.join(codes),'dataFormat':'csv'})
          print('Requesting official NaPTAN codes:',','.join(codes),flush=True)
          req=urllib.request.Request(url,headers={'User-Agent':'InspectorHub/1.0','Accept':'text/csv,application/zip,application/octet-stream'})
          with urllib.request.urlopen(req,timeout=110) as response:
              payload=response.read()
              print('Content type:',response.headers.get('Content-Type'),'bytes:',len(payload),flush=True)
          if zipfile.is_zipfile(io.BytesIO(payload)):
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  names=z.namelist()
                  print('Archive files:',names[:30],flush=True)
                  candidates=[n for n in names if pathlib.PurePosixPath(n).name.lower()=='stops.csv']
                  if not candidates:candidates=[n for n in names if n.lower().endswith('.csv')]
                  if not candidates:raise SystemExit('No stops CSV in NaPTAN archive')
                  data=z.read(candidates[0])
          else:data=payload
          data=data.decode('utf-8-sig',errors='replace')
          rd=csv.DictReader(io.StringIO(data))
          print('CSV headers:',rd.fieldnames,flush=True)
          def col(r,*keys):
              norm={k.strip().lower().replace(' ',''):v for k,v in r.items() if k}
              for key in keys:
                  v=norm.get(key.lower().replace(' ',''))
                  if v is not None and str(v).strip():return str(v).strip()
              return ''
          found={}
          convert=Transformer.from_crs('EPSG:27700','EPSG:4326',always_xy=True)
          from collections import Counter
          raw_counts=Counter()
          raw_types=Counter()
          for row in rd:
              atco=col(row,'ATCOCode','Atco Code')
              raw_counts[atco[:3]]+=1
              if atco[:3] in ['617','618','619']:raw_types[col(row,'StopType')]+=1
              if atco[:3] not in codes:continue
              typ=col(row,'StopType')
              if typ and not typ.upper().startswith('B'):continue
              lat=col(row,'Latitude')
              lon=col(row,'Longitude')
              if not lat or not lon:
                  east=col(row,'Easting');north=col(row,'Northing')
                  if east and north:
                      try:
                          a,b=convert.transform(float(east),float(north))
                          lon=str(round(a,7));lat=str(round(b,7))
                      except (ValueError,TypeError):pass
              if not atco or not lat or not lon:continue
              found[atco]=[atco,col(row,'CommonName','ShortCommonName','Name'),col(row,'LocalityName','Locality','Town'),col(row,'Indicator','StopIndicator'),lat,lon,'DfT NaPTAN',datetime.date.today().isoformat()]
          print('Raw ATCO codes returned:',dict(raw_counts),flush=True)
          print('Ayrshire stop types:',dict(raw_types),flush=True)
          print('Verified official West Scotland bus stop rows:',len(found),flush=True)
          from collections import Counter
          print('Codes:',dict(Counter(k[:3] for k in found)),flush=True)
          if len(found)<3000 or not any(k.startswith('617') for k in found) or not any(k.startswith('619') for k in found):raise SystemExit('Ayrshire records missing or incomplete; refusing to overwrite')
          dest=pathlib.Path('west-scotland-bus-stops.csv')
          with dest.open('w',newline='',encoding='utf-8') as out:
              writer=csv.writer(out);writer.writerow(['ATCO Code','Stop Name','Locality','Indicator','Latitude','Longitude','Source','Last Updated'])
              writer.writerows(sorted(found.values(),key=lambda r:(r[2].lower(),r[1].lower(),r[0])))
          PY
      - name: Commit official stop CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add west-scotland-bus-stops.csv
          git diff --cached --quiet || (git commit -m 'Export official West Scotland NaPTAN stops' && git push)
