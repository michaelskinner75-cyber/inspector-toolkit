name: Refresh Scottish bus stops
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-bus-stops.yml'
      - 'scripts/build_scotland_stops.py'
  schedule:
    - cron: '13 4 * * 1'
permissions:
  contents: write
jobs:
  refresh-stops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download DfT NaPTAN and generate local stop catalogue
        run: python scripts/build_scotland_stops.py
      - name: Publish bus stop data to GitHub Pages repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scotland-bus-stops.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update local Scottish bus stop catalogue from NaPTAN'
            git push
          else
            echo 'Local catalogue already up to date.'
          fi
