name: Audit eight remaining Fife service registrations
on:
  push:
    paths:
      - '.github/workflows/inspect-eight-fife-routes.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact current Fife registrations and stops
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import resolve_official_fife_routes as r
          import import_official_fife_times as f
          codes=['4','6','7','7B','7C','8','14A','59']
          with f.download() as z: opts=f.ingest_archive(z,set(codes))
          for code in codes:
            print('CODE',code,flush=True)
            for item in opts.get(code,{}).get('Wednesday',[]):
              trips=item['trips'].get((code,'Wednesday'),[])
              examples=[]
              for t in trips[:2]:
                labels=t['stops']
                examples.append((labels.get(t['origin']),labels.get(t['terminal']),t['dest']))
              print(' FILE',item['sourcefile'],'REG',item['servicecode'],
                'START',item['start'],'END',item['end'],
                'EDIT',item['last_edit'],'TRIPS',len(trips),
                'WARN',dict(item['warnings']),'SAMPLE',examples,flush=True)
          PY
