name: Import verified official Fife timetables
on:
  push:
    paths:
      - 'scripts/import_official_fife_times.py'
      - 'data/fife-active-services.json'
      - '.github/workflows/inspect-stagecoach-txc.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Import official Stagecoach timetable entries for remaining verified routes
        run: python3 scripts/import_official_fife_times.py --mode apply
