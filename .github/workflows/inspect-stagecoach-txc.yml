name: Verify official Stagecoach Fife timetable importer
on:
  push:
    paths:
      - 'scripts/import_official_fife_times.py'
      - 'data/fife-active-services.json'
      - '.github/workflows/inspect-stagecoach-txc.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run all Fife services against official Stagecoach archive
        run: python3 scripts/import_official_fife_times.py --mode dry-run
