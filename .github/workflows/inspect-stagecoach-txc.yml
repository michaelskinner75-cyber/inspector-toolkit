name: Import verified Stagecoach Fife times (pilot)
on:
  push:
    paths:
      - 'scripts/import_official_fife_times.py'
      - 'data/fife-active-services.json'
      - '.github/workflows/inspect-stagecoach-txc.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import one verified Fife service to test Sheets read-back
        run: python3 scripts/import_official_fife_times.py --mode apply --limit 1
