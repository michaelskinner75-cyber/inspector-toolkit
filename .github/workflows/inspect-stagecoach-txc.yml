name: Inspect official East Scotland timetable archive
on:
  push:
    paths:
      - '.github/workflows/inspect-stagecoach-txc.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Stagecoach East Scotland TXC files
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, tempfile, os, xml.etree.ElementTree as ET, re, collections
          url='https://opendata.stagecoachbus.com/stagecoach-scfi-route-schedule-data-transxchange_2_4.zip'
          try:
            with tempfile.NamedTemporaryFile(suffix='.zip') as f:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'InspectorHubTimetableImporter/1.0'}), timeout=90) as r:
                size=0
                while True:
                  chunk=r.read(1048576)
                  if not chunk: break
                  f.write(chunk); size+=len(chunk)
                  if size>200*1024*1024: raise ValueError('Archive over 200MB; stopped safely')
              print('ARCHIVE BYTES',size)
              f.flush()
              with zipfile.ZipFile(f.name) as z:
                names=[x for x in z.namelist() if x.lower().endswith('.xml')]
                print('XML FILES',len(names),'FIRST',names[:4])
                def tag(e):return e.tag.rsplit('}',1)[-1]
                for name in names[:2]:
                  content=z.read(name)
                  root=ET.fromstring(content)
                  print('FILE',name,'BYTES',len(content),'ROOT',tag(root))
                  print('ROOT CHILDREN',[(tag(c),len(c)) for c in root])
                  for want in ['Service','ServiceCode','LineName','VehicleJourney','JourneyPattern','JourneyPatternSection','JourneyPatternTimingLink','AnnotatedStopPointRef','StopPointRef','OperatingProfile','StopPoint','Schedule','JourneyPatternRef','DepartureTime']:
                    items=[x for x in root.iter() if tag(x)==want]
                    print('TAG',want,'COUNT',len(items))
                    if items:
                      first=items[0]
                      print('  EXAMPLE',ET.tostring(first,encoding='unicode')[:600].replace('\\n',' '))
                print('SERVICE7 FILES',[n for n in names if re.search(r'(?:^|[^0-9])7(?:[^0-9]|$)',n)][:12])
          except Exception as e:
            print('DIAGNOSTIC ERROR',type(e).__name__,str(e)[:300]);raise
          PY
