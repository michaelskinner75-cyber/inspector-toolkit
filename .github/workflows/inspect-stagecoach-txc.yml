name: Inspect official East Scotland timetable archive
on:
  push:
    paths:
      - '.github/workflows/inspect-stagecoach-txc.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect a live TXC route's stop and journey patterns
        run: |
          python3 - <<'PY'
          import urllib.request, zipfile, tempfile, xml.etree.ElementTree as ET, re
          url='https://opendata.stagecoachbus.com/stagecoach-scfi-route-schedule-data-transxchange_2_4.zip'
          with tempfile.NamedTemporaryFile(suffix='.zip') as f:
            with urllib.request.urlopen(url,timeout=90) as response:
              while True:
                b=response.read(1048576)
                if not b:break
                f.write(b)
            f.flush()
            with zipfile.ZipFile(f.name) as archive:
              path=archive.namelist()[0]
              root=ET.fromstring(archive.read(path))
              ns={'t':'http://www.transxchange.org.uk/'}
              for tag in ['StartDate','EndDate','AnnotatedStopPointRef','JourneyPattern','JourneyPatternSection','JourneyPatternTimingLink','VehicleJourney','OperatingProfile']:
                e=root.find('.//t:'+tag,ns)
                print('======',tag,'======')
                if e is not None:
                  snippet=ET.tostring(e,encoding='unicode')
                  print(snippet[:5400].replace('ns0:', '').replace(' xmlns:ns0="http://www.transxchange.org.uk/"',''))
              print('FIRST FILE',path)
          PY
